name: PR checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-safety:
    name: repository-safety
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Scan tracked repository content
        shell: powershell
        run: |
          .\tools\github\Invoke-RepositorySafetyCheck.ps1 `
            -RepositoryRoot $PWD `
            -Scope Tracked

  lightweight-tests:
    name: lightweight-tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install source-only development dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Run lightweight source tests
        shell: powershell
        run: |
          python -m pytest .\tests `
            --ignore .\tests\test_media_integration.py `
            --ignore .\tests\test_ffmpeg_install_source.py `
            -k "not probe_corrupt_file_returns_clear_error"
          python -m pytest .\experiments\asr\tests `
            -k "not existing_399_sentence_info_result_is_byte_for_byte_reproducible"
          python -m pip check

  task-report-gate:
    name: task-report-gate
    runs-on: windows-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require a task report
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            git fetch origin $env:GITHUB_BASE_REF --no-tags
            $changed = @(git diff --name-only "origin/$env:GITHUB_BASE_REF...HEAD")
            $reports = @($changed | Where-Object {
              $_ -match '^tasks/reports/.+\.(md|MD)$'
            })
            if ($reports.Count -eq 0) {
              throw "Pull requests must add or update a task report under tasks/reports/."
            }
          } else {
            $reports = @(Get-ChildItem -File .\tasks\reports\*.md)
            if ($reports.Count -eq 0) {
              throw "The repository baseline must contain at least one task report."
            }
          }
          Write-Output "Task report gate passed with $($reports.Count) report file(s)."
