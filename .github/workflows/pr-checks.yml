name: PR checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: repository-safety
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Scan tracked repository content
        shell: powershell
        run: |
          .\tools\github\Invoke-RepositorySafetyCheck.ps1 `
            -RepositoryRoot $PWD `
            -Scope Tracked

  lightweight-tests:
    name: lightweight-tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install source-only development dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Installing locked development dependencies failed with exit code $LASTEXITCODE."
          }
          python -m pip install --disable-pip-version-check --no-deps -e .
          if ($LASTEXITCODE -ne 0) {
            throw "Installing the repository package failed with exit code $LASTEXITCODE."
          }
      - name: Run lightweight source tests
        shell: powershell
        run: |
          .\tools\github\Invoke-SourceOnlyTests.ps1

  task-report-gate:
    name: task-report-gate
    runs-on: windows-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Require a task report
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            git fetch origin $env:GITHUB_BASE_REF --no-tags
            $changed = @(git diff --name-only "origin/$env:GITHUB_BASE_REF...HEAD")
            $reports = @($changed | Where-Object {
              $_ -match '^tasks/reports/.+\.(md|MD)$'
            })
            if ($reports.Count -eq 0) {
              throw "Pull requests must add or update a task report under tasks/reports/."
            }
          } else {
            $reports = @(Get-ChildItem -File .\tasks\reports\*.md)
            if ($reports.Count -eq 0) {
              throw "The repository baseline must contain at least one task report."
            }
          }
          Write-Output "Task report gate passed with $($reports.Count) report file(s)."
